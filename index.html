<!-- ⏳ SCRIPT -->
<script>
var isClicked = false; 
var telegramUrl = "https://t.me/+dSd55BiTdzAzMWM1"; 

function trackButtonClick() {
    if (!isClicked) {
        isClicked = true; 

        if (typeof fbq !== 'undefined') {
            fbq('trackCustom', 'TelegramBtnClick'); 
            fbq('track', 'Subscribe'); 
        }

        var btn = document.getElementById('telegramLink');
        if (btn) {
            btn.style.pointerEvents = 'none'; 
            btn.style.opacity = '0.7';       
        }

        setTimeout(function() {
            window.location.href = telegramUrl;
        }, 300);
    }
}

let timeLeft = 10;
let countdownEl = document.getElementById("countdown");

let timer = setInterval(function(){
  timeLeft--;
  countdownEl.innerHTML = "Redirecting in " + timeLeft + " sec...";

  if(timeLeft <= 3){
    countdownEl.style.color = "red";
  }

  if(timeLeft <= 0){
    clearInterval(timer);
    window.location.href = telegramUrl;
  }
}, 1000);
</script>
